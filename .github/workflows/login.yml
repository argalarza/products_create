name: 🚀 Build & Deploy Create Product Service to EC2

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    name: 🐳 Build & Push Docker Image + ☁️ Deploy to EC2....
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: |
          docker build -t agente47/create-product-service:latest .
          docker push agente47/create-product-service:latest

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🛠️ Instalando Docker y Docker Compose si no existen..."
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            echo "⚙️ Configurando variables de entorno..."
            cat <<EOF | sudo tee /home/ec2-user/.env.create-product-service
            MONGO_URI=mongodb://serious:123456@23.20.252.222:27017/products_db?authSource=admin
            DB_NAME=products_db
            JWT_SECRET=mysecretkey1234
            EOF

            echo "📦 Desplegando contenedor..."
            sudo docker pull agente47/create-product-service:latest
            sudo docker network inspect my_global_network >/dev/null 2>&1 || \
              sudo docker network create my_global_network
            sudo docker stop create-product-service || true
            sudo docker rm create-product-service || true
            sudo docker run -d --name create-product-service \
              --env-file /home/ec2-user/.env.create-product-service \
              -p 4007:4007 \
              --network my_global_network \
              agente47/create-product-service:latest
