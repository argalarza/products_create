name: 🚀 Build & Deploy Create Product Service to EC2

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    name: 🐳 Build & Push Docker Image + ☁️ Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: |
          docker build -t agente47/create-product-service:latest .
          docker push agente47/create-product-service:latest

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cat <<EOF | sudo tee /home/ec2-user/.env.create-product-service
            MONGO_URI=mongodb://serious:123456@23.20.252.222:27017/products_db?authSource=admin
            DB_NAME=products_db
            JWT_SECRET=mysecretkey1234
            EOF

            sudo docker pull agente47/create-product-service:latest
            sudo docker network inspect my_global_network >/dev/null 2>&1 || \
              sudo docker network create my_global_network
            sudo docker stop cr
